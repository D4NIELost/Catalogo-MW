<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo MW</title>
    <link rel="stylesheet" href="styles.css?v=4.3">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#de2427">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="refreshBtn" class="refresh-btn" title="Hard refresh">📱 Catalogo MW</h1>
            <div class="header-right">
                <button id="qrBtn" class="qr-btn" title="Mostra QR Code">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="7" height="7" fill="white"/>
                        <rect x="14" y="3" width="7" height="7" fill="white"/>
                        <rect x="3" y="14" width="7" height="7" fill="white"/>
                        <rect x="5" y="5" width="3" height="3" fill="#de2427"/>
                        <rect x="16" y="5" width="3" height="3" fill="#de2427"/>
                        <rect x="5" y="16" width="3" height="3" fill="#de2427"/>
                        <rect x="14" y="14" width="2" height="2" fill="white"/>
                        <rect x="17" y="14" width="2" height="2" fill="white"/>
                        <rect x="14" y="17" width="2" height="2" fill="white"/>
                        <rect x="17" y="17" width="2" height="2" fill="white"/>
                        <rect x="14" y="14" width="2" height="2" fill="#de2427"/>
                        <rect x="17" y="17" width="2" height="2" fill="#de2427"/>
                    </svg>
                </button>
                <span class="version">v3.2</span>
            </div>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Cerca prodotto (modello, marca o codice PIM)">
            <button id="clearSearch">✖️</button>
        </div>

        <div id="searchResults" class="search-results hidden"></div>

        <nav class="main-nav">
            <button id="navPhones" class="nav-btn active">📱 Dispositivi</button>
            <button id="navServices" class="nav-btn">🔧 Servizi e Software</button>
        </nav>

        <main id="mainContent">
            <!-- Dynamic content will be loaded here -->
        </main>

        <footer class="footer-nav">
            <button id="backBtn">⬅️ Indietro</button>
            <button id="homeBtn">🏠 Home</button>
        </footer>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="qr-modal hidden">
        <div class="qr-modal-content">
            <button id="closeQrModal" class="close-modal">&times;</button>
            <h2>Scansiona il QR Code</h2>
            <div id="qrCodeContainer" class="qr-code-container"></div>
            <p class="qr-url" id="qrUrl"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js?v=4.4"></script>
    <script>
        // Service worker temporarily disabled for testing
        // if ('serviceWorker' in navigator) {
        //     navigator.serviceWorker.register('./sw.js').then(registration => {
        //         console.log('ServiceWorker registration successful');
        //     }).catch(err => {
        //         console.log('ServiceWorker registration failed:', err);
        //     });
        // }
    </script>
</body>
</html>
